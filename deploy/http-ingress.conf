worker_processes 1;
pid /tmp/http-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

stream {
    access_log off;

    server {
        listen 8080;
        proxy_pass nginx:8080;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
    }
}
