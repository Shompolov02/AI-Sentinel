pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    server {
        listen 8443 ssl;
        server_name core-intake;
        ssl_certificate /run/secrets/intake.crt;
        ssl_certificate_key /run/secrets/intake.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /health { return 200 'ok'; }
        location = /internal/events {
            limit_except POST HEAD { deny all; }
            set $core_upstream core:8000;
            proxy_pass http://$core_upstream;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_set_header Host core;
        }
        location / { return 404; }
    }
}
