pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;
    server {
        listen 8082;
        server_name _;
        error_page 502 504 =503 @core_unavailable;
        location @core_unavailable {
            default_type text/html;
            charset utf-8;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Core недоступен</title><h1>Core недоступен</h1><p>Критическая проблема: проверьте журналы и контейнеры.</p><p>Состояние задач сейчас проверить нельзя.</p></html>';
        }
        location ~ ^/(?:login(?:\.js)?|task\.js|tasks(?:/[0-9a-f-]+)?|api/tasks/[0-9a-f-]+(?:/evidence/[0-9a-f-]+/raw)?)?$ {
            set $core_upstream core:8000;
            proxy_pass http://$core_upstream;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /health { return 200 'ok'; }
        location / { return 404; }
    }
}
