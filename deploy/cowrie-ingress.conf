worker_processes 1;
pid /tmp/cowrie-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

stream {
    access_log off;

    server {
        listen 2222;
        proxy_pass cowrie:2222;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 180s;
    }

    server {
        listen 2223;
        proxy_pass cowrie:2223;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        proxy_timeout 180s;
    }
}
