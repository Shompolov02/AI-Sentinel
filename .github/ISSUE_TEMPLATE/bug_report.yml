name: Defect
description: Report a reproducible defect.
title: "Defect: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include the smallest reproduction and the expected result.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security and operational impact
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true