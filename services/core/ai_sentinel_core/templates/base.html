<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="10;url=?poll=1">{% endif %}
<title>{{ title }}</title>
<style>
body { max-width:1100px; margin:2rem auto; padding:1rem; font:17px system-ui;
       background:#f5f7fb; color:#182331; }
a { color:#174ea6; } dd { white-space:pre-wrap; overflow-wrap:anywhere; }
td,th { padding:.6rem; text-align:left; }
input,button { font:inherit; padding:.5rem; }
section { background:white; border:1px solid #dce2ed; border-radius:12px;
          padding:1rem; margin:1rem 0; overflow-x:auto; }
dt { font-weight:600; margin-top:.8rem; } dd { margin:.2rem 0; }
nav { margin-bottom:2rem; } .low { color:#246141; font-weight:700; }
.task-id { overflow-wrap:anywhere; }
.evidence-text { white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
</head>
<body>
<nav><a href="/tasks">Список задач</a> · {{ role | default('SecOps') }} · Только чтение</nav>
<h1 class="task-id">{{ title }}</h1>
{% block content %}{% endblock %}
</body>
</html>
