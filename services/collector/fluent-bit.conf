[SERVICE]
    Flush 1
    Grace 5
    Log_Level warn
    storage.path /data/chunks
    storage.sync full
    storage.checksum on

# Only password-free normalized events reach this input. Raw Cowrie is never
# passed to Fluent Bit's chunk engine, even transiently on disk.
[INPUT]
    Name stdin
    Tag cowrie.normalized
    # Built-in JSON stream decoder accepts multiple NDJSON records per read.
    # A configured single-record parser rejects coalesced pipe writes.
    Buffer_Size 128k
    storage.type filesystem

[OUTPUT]
    Name http
    Match cowrie.normalized
    Host 127.0.0.1
    Port 8090
    URI /deliver
    Format json
    Json_date_key false
    Log_Response_Payload false
    Retry_Limit no_limits
